<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Smartphone Frame -->
  <rect x="118" y="48" width="220" height="360" rx="36" ry="36" fill="#18191D" stroke="url(#gradPrimary)" stroke-width="8" />

  <!-- Earpiece / Sensor notch -->
  <rect x="198" y="68" width="60" height="6" rx="3" fill="#3A3D45" />

  <!-- Display Area -->
  <rect x="134" y="90" width="188" height="290" rx="16" ry="16" fill="#0C0D10" />

  <!-- Biometric Fingerprint Ridges (Concentric Optic Arcs) -->
  <!-- Outer Ridge -->
  <path d="M 188 235 A 40 40 0 0 1 268 235" fill="none" stroke="url(#gradPrimary)" stroke-width="5" stroke-linecap="round" />
  <path d="M 180 255 A 48 48 0 0 1 276 255" fill="none" stroke="#4F46E5" stroke-width="4.5" stroke-linecap="round" />

  <!-- Middle Ridge -->
  <path d="M 200 220 A 28 28 0 0 1 256 220" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <path d="M 194 270 A 34 34 0 0 0 262 270" fill="none" stroke="#F97316" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Loop -->
  <path d="M 214 208 A 14 14 0 0 1 242 208" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 218 208 V 242" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <path d="M 238 208 V 238" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />

  <!-- Center Optical Focal Sensor (Nó 5) -->
  <circle cx="228" cy="235" r="7" fill="#F97316" />
  <circle cx="228" cy="235" r="14" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.8" />

  <!-- Hardware Pulse Waveforms (Top & Bottom) -->
  <path d="M 154 135 H 180 L 192 120 L 204 150 L 216 130 L 226 135 H 302" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="302" cy="135" r="3.5" fill="#10B981" />

  <!-- Touch Status Scan Bar -->
  <rect x="160" y="325" width="136" height="5" rx="2.5" fill="#334155" />
  <rect x="180" y="325" width="60" height="5" rx="2.5" fill="url(#gradPrimary)" />
</svg>
